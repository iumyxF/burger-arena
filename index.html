<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汉堡竞技场 · BURGER ARENA</title>
<style>
:root{
  --ink:#e8e4da; --mid:#4a4a4a; --dim:#2a2a2a; --gold:#FFC72C; --red:#DA291C;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#050505;overflow:hidden}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;user-select:none;cursor:default}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0d0d0d;
  box-shadow:0 0 0 1px #1a1a1a, 0 30px 90px rgba(0,0,0,.9)}
#game{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;inset:0;pointer-events:none;font-size:11px;letter-spacing:.08em;
  color:var(--ink);text-shadow:0 1px 0 #000}
#topbar{position:absolute;top:9px;left:12px;right:12px;display:flex;align-items:center;gap:8px}
#hpbox{display:flex;align-items:center;gap:6px;font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#a8a29a}
#hpbar{width:118px;height:7px;border:1px solid #3a3a3a;background:#151515;padding:1px}
#hpfill{display:block;height:100%;background:var(--ink);width:100%}
#hpfill.low{background:var(--red)}
#timer{position:absolute;left:50%;transform:translateX(-50%);font-family:ui-monospace,Consolas,monospace;
  font-size:17px;letter-spacing:.14em;color:#d8d3c8}
#timer.urgent{color:var(--red)}
#kills{margin-left:auto;color:#7d7770;font-family:ui-monospace,Consolas,monospace;font-size:10px}
#bossbar{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:232px;height:5px;
  background:#161616;border:1px solid #3a1a16}
#bossfill{display:block;height:100%;width:100%;background:var(--red)}
#bossname{position:absolute;top:-15px;left:0;width:100%;text-align:center;font-size:9px;color:#c9c2b6;letter-spacing:.3em}
#bottombar{position:absolute;left:12px;bottom:16px;display:flex;align-items:flex-end;gap:8px}
#lvbadge{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:#8d877f;border:1px solid #333;
  padding:2px 5px;background:#101010}
#slots{display:flex;gap:4px}
.slot{width:20px;height:20px;border:1px solid #2e2e2e;background:#101010;display:flex;
  align-items:center;justify-content:center;position:relative}
.slot canvas{width:16px;height:16px;image-rendering:pixelated}
.slot b{position:absolute;right:0;bottom:-1px;font-size:7px;color:var(--gold);font-family:monospace}
#xptrack{position:absolute;left:0;right:0;bottom:0;height:2px;background:#181818}
#xpfill{display:block;height:100%;width:0;background:var(--gold)}
#tip{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);font-size:10px;letter-spacing:.16em;
  color:#8d877f;opacity:0;transition:opacity .5s ease;white-space:nowrap}
#hurt{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .28s ease;
  box-shadow:inset 0 0 90px 10px rgba(218,41,28,.55)}
#redflash{position:absolute;inset:0;pointer-events:none;opacity:0;background:rgba(218,41,28,.22);transition:opacity .18s}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(6,6,6,.82);z-index:10;gap:10px}
.hide{display:none!important}
#menu{background:radial-gradient(circle at 50% 45%,#141414 0%,#070707 70%)}
#menu canvas{image-rendering:pixelated;width:190px;height:88px;margin-bottom:2px}
#menu h1{font-size:30px;letter-spacing:.34em;font-weight:800;text-indent:.34em}
#menu .en{font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.55em;color:#8a8478;text-indent:.55em}
#startbtn{margin-top:22px;background:transparent;border:1px solid var(--gold);color:var(--gold);
  padding:9px 44px;font-size:13px;letter-spacing:.4em;text-indent:.4em;cursor:pointer;font-family:inherit;
  transition:background .12s,color .12s}
#startbtn:hover{background:var(--gold);color:#111}
#menu .hint{margin-top:18px;font-size:10px;color:#6f6a63;letter-spacing:.14em}
#menu .fine{position:absolute;bottom:14px;font-size:9px;color:#4a463f;letter-spacing:.1em}
#cards{background:rgba(5,5,5,.9);gap:16px}
.card-title{font-size:12px;letter-spacing:.28em;color:#b6b0a5}
.card-title b{color:var(--gold);font-family:monospace}
.card-row{display:flex;gap:14px}
.card{width:150px;background:#121212;border:1px solid #333;padding:12px 11px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .1s,border-color .1s}
.card:hover,.card.sel{transform:translateY(-5px);border-color:var(--gold)}
.card canvas{width:56px;height:56px;image-rendering:pixelated;margin-bottom:1px}
.card .cname{font-size:13px;letter-spacing:.12em}
.card .clv{font-family:monospace;font-size:9px;color:#8a8478;letter-spacing:.05em}
.card .cstat{font-family:ui-monospace,Consolas,monospace;font-size:9px;color:#c3bdae;text-align:center;line-height:1.5}

.card-hint{font-size:9px;color:#5f5a52;letter-spacing:.14em}
kbd{border:1px solid #3a3a3a;padding:1px 4px;font-family:monospace;font-size:9px;color:#a8a29a}
.panel{background:#101010;border:1px solid #333;padding:26px 34px;display:flex;flex-direction:column;
  align-items:center;gap:12px;min-width:280px}

<script>
"use strict";
/* ============================================================
   汉堡竞技场 —— 单文件像素生存 Roguelike
   营养数据 -> 卡牌属性：见 buildNut()
   ============================================================ */

/* ---------- 0. 基础 ---------- */
const VW = 480, VH = 270, WW = 960, WH = 540;
const TAU = Math.PI * 2;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const stage = document.getElementById('stage');

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const hypo = (x, y) => Math.sqrt(x * x + y * y);

const C = {
  bg: '#111111', floor: '#2b2b2b', floor2: '#232323', line: '#3a3a3a',
  mid: '#5a5a5a', dim: '#333333', light: '#9a9a9a', white: '#e8e4da',
  gold: '#FFC72C', red: '#DA291C', dark: '#161616', shadow: '#101010'
};

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  let s = Math.min(w / VW, h / VH);
  if (s >= 1) s = Math.floor(s * 2) / 2;
  stage.style.width = (VW * s) + 'px';
  stage.style.height = (VH * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

/* ---------- 1. 音频（全合成，无外部资源） ---------- */
const SFX = {
  ac: null, master: null, noiseBuf: null, last: {}, muted: false,
  init() {
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    const m = this.ac.createGain(); m.gain.value = 0.55;
    const lp = this.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6800;
    const comp = this.ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 14; comp.ratio.value = 4;
    comp.attack.value = 0.004; comp.release.value = 0.22;
    m.connect(lp); lp.connect(comp); comp.connect(this.ac.destination);
    this.master = m;
    const len = Math.floor(this.ac.sampleRate * 1.2);
    const b = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = b;
  },
  tone(o) {
    if (!this.ac || this.muted) return;
    const t0 = this.ac.currentTime + (o.when || 0);
    const osc = this.ac.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(18, o.to), t0 + o.dur);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, o.vol), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    let node = osc;
    if (o.lp) {
      const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp;
      osc.connect(f); node = f;
    }
    node.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + o.dur + 0.03);
  },
  noise(o) {
    if (!this.ac || this.muted || !this.noiseBuf) return;
    const t0 = this.ac.currentTime + (o.when || 0);
    const src = this.ac.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = o.type || 'lowpass';
    f.frequency.setValueAtTime(o.from || 1400, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, o.to || 300), t0 + o.dur);
    f.Q.value = o.q || 1;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, o.vol), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + o.dur + 0.02);
  },
  play(name) {
    if (!this.ac || this.muted) return;
    const now = this.ac.currentTime;
    if (this.last[name] && now - this.last[name] < 0.04) return;
    this.last[name] = now;
    switch (name) {
      case 'shot': this.tone({ f: 300, to: 140, dur: 0.07, type: 'square', vol: 0.05, lp: 1700 }); break;
      case 'hit': this.tone({ f: 320, to: 210, dur: 0.05, type: 'triangle', vol: 0.07 });
        this.noise({ dur: 0.03, vol: 0.05, from: 2000, to: 900, type: 'bandpass', q: 1.2 }); break;
      case 'crit': this.tone({ f: 900, to: 1320, dur: 0.08, type: 'sine', vol: 0.08 }); break;
      case 'kill': this.noise({ dur: 0.13, vol: 0.08, from: 1100, to: 240 }); break;
      case 'boom': this.noise({ dur: 0.34, vol: 0.16, from: 1300, to: 180 });
        this.tone({ f: 78, to: 46, dur: 0.22, type: 'sine', vol: 0.16 }); break;
      case 'pick': this.tone({ f: 660, to: 1000, dur: 0.06, type: 'sine', vol: 0.04 }); break;
      case 'level': [523, 659, 784].forEach((f, i) => this.tone({ f, dur: 0.11, type: 'sine', vol: 0.075, when: i * 0.07 })); break;
      case 'hurt': this.tone({ f: 150, to: 78, dur: 0.16, type: 'sawtooth', vol: 0.10, lp: 620 }); break;
      case 'boss': this.tone({ f: 55, to: 44, dur: 0.7, type: 'sawtooth', vol: 0.17, lp: 380 });
        this.tone({ f: 58.5, to: 46, dur: 0.7, type: 'sawtooth', vol: 0.12, lp: 380 }); break;
      case 'warn': this.tone({ f: 440, dur: 0.05, type: 'square', vol: 0.045, lp: 2400 }); break;
      case 'dash': this.noise({ dur: 0.16, vol: 0.09, from: 3000, to: 500, type: 'bandpass', q: 0.8 }); break;
      case 'evolve': [392, 523, 659, 880].forEach((f, i) => this.tone({ f, dur: 0.16, type: 'triangle', vol: 0.08, when: i * 0.08 })); break;
    }
  },
  bgm: { on: false, step: 0, next: 0, bpm: 96 },
  bgmTick() {
    if (!this.ac || this.muted || !this.bgm.on) return;
    const ac = this.ac, b = this.bgm;
    const spb = 60 / b.bpm / 2;
    if (b.next < ac.currentTime) b.next = ac.currentTime + 0.05;
    while (b.next < ac.currentTime + 0.25) {
      const s = b.step % 16;
      const bass = [55, 55, 65.4, 55, 73.4, 73.4, 65.4, 55][Math.floor(s / 2)];
      const t0 = b.next;
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = bass;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.035, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + spb * 0.9);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
      o.connect(f); f.connect(g); g.connect(this.master);
      o.start(t0); o.stop(t0 + spb);
      if (s % 4 === 2) this.noise({ dur: 0.03, vol: 0.018, from: 7000, to: 5000, type: 'highpass' });
      b.step++; b.next += spb;
    }
  }
};

const NUT = new Map();
function buildNut() {
  NUT.clear();
  for (const r of MCD) {
    const K = clamp(r.kcal / 550, 0.30, 1.6);
    const P = clamp(r.p / 25, 0.20, 1.6);
    const Cc = clamp(r.c / 45, 0.20, 1.6);
    const F = clamp(r.f / 28, 0.10, 1.6);
    const S = clamp((r.na || 0) / 900, 0.05, 1.6);
    const sp = r.p * 4, sc = r.c * 4, sf = r.f * 9;
    const tot = sp + sc + sf || 1;
    const share = { p: sp / tot, c: sc / tot, f: sf / tot };
    const top = Object.keys(share).sort((a, b) => share[b] - share[a])[0];
    let tag = '';
    if (r.kcal < 30 && r.p + r.c + r.f < 6) tag = '咖啡因';
    else if (share[top] > 0.42) tag = { p: '高蛋白', c: '高碳水', f: '高脂肪' }[top];
    else if (S >= 0.9) tag = '高钠';
    else if (K >= 1.0) tag = '热量炸弹';
    NUT.set(r.n, {
      K, P, C: Cc, F, S,
      dmgMul: 0.70 + 0.60 * K,
      cdMul: 1 / (0.72 + 0.45 * Cc),
      nAdd: clamp(Math.floor((F - 0.45) * 1.4), 0, 2),
      rMul: 0.85 + 0.45 * F,
      crit: clamp(0.03 + 0.14 * (S - 0.40), 0.03, 0.32),
      tag, row: r
    });
  }
}
buildNut();

}

function bake(map, pal) {
  const w = map[0].length, h = map.length;
  const mk = white => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = map[y][x];
        if (ch === '.' || ch === ' ') continue;
        g.fillStyle = white ? '#ffffff' : (pal[ch] || '#888');
        g.fillRect(x, y, 1, 1);
      }
    }
    return c;
  };
  return { img: mk(false), flash: mk(true), w, h };
}

    ctx.translate(px + s.w, py);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0);
    ctx.restore();
  }
}

/* 汉堡：程序化绘制（Boss / 精英 / 图标共用） */
function burgerShape(x, y, w, h, white) {
  const left = Math.round(x - w / 2), top = Math.round(y - h / 2);
  const bun = white ? '#fff' : '#d8cdb8';
  const bunD = white ? '#eee' : '#b8ab92';
  const meat = white ? '#fff' : '#39352f';
  const meat2 = white ? '#fff' : '#2c2925';
  const letc = white ? '#fff' : '#6d7a5f';
  for (let ry = 0; ry < h; ry++) {
    const t = ry / (h - 1);
    let inset = 0;
    if (t < 0.34) inset = Math.round(w * 0.42 * Math.pow(1 - t / 0.34, 1.5));
    else if (t > 0.84) inset = Math.round(w * 0.42 * Math.pow((t - 0.84) / 0.16, 1.5));
    const ww = Math.max(1, w - inset * 2);
    let col;
    if (t < 0.26) col = bun;
    else if (t < 0.33) col = letc;
    else if (t < 0.52) col = meat;
    else if (t < 0.6) col = bunD;
    else if (t < 0.74) col = meat2;
    else if (t < 0.82) col = letc;
    else col = bun;
    ctx.fillStyle = col;
    ctx.fillRect(left + inset, top + ry, ww, 1);
  }
  if (!white && h > 10) {
    ctx.fillStyle = '#efe7d4';
    const seeds = [[0.32, 0.1], [0.5, 0.06], [0.68, 0.12], [0.42, 0.18], [0.6, 0.2]];
    for (const [sx, sy] of seeds) ctx.fillRect(Math.round(left + w * sx), Math.round(top + h * sy), 1, 1);
  }
}

/* 数字字体 3x5 */
const GLYPH = {
  '0': [7, 5, 5, 5, 7], '1': [2, 6, 2, 2, 7], '2': [7, 1, 7, 4, 7], '3': [7, 1, 3, 1, 7],
  '4': [5, 5, 7, 1, 1], '5': [7, 4, 7, 1, 7], '6': [7, 4, 7, 5, 7], '7': [7, 1, 2, 2, 2],
  '8': [7, 5, 7, 5, 7], '9': [7, 5, 7, 1, 7], '+': [0, 2, 7, 2, 0], '-': [0, 0, 7, 0, 0],
  'k': [5, 5, 6, 5, 5]
};
function drawText(str, x, y, color, scale) {
  const s = scale || 1;
  const w = str.length * 4 * s - s;
  let px = Math.round(x - w / 2);
  ctx.fillStyle = color;
  for (const ch of str) {
    const gl = GLYPH[ch];
    if (gl) {
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 3; c++) {
          if (gl[r] & (1 << (2 - c))) ctx.fillRect(px + c * s, Math.round(y) + r * s, s, s);
        }
      }
    }
    px += 4 * s;
  }
}

(function drawArches() {
  const c = document.getElementById('arches');
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.fillStyle = C.gold;
  const arch = (cx) => {
    const R = 24, T = 9, cy = 30, legH = 20;
    g.beginPath();
    g.arc(cx, cy, R, Math.PI, 0);
    g.closePath();
    g.fill();
    g.fillRect(cx - R, cy, T, legH);
    g.fillRect(cx + R - T, cy, T, legH);
    g.globalCompositeOperation = 'destination-out';
    g.beginPath();
    g.arc(cx, cy, R - T, Math.PI, 0);
    g.closePath();
    g.fill();
    g.fillRect(cx - R + T, cy, (R - T) * 2, legH);
    g.globalCompositeOperation = 'source-over';
  };
  arch(40); arch(80);
})();

/* ---------- 7. 数值聚合 ---------- */
function recalc() {
  const s = {
    maxHp: 100, speed: 78, atk: 1, atkSpeed: 1, cdr: 1, crit: 0.05,
    knock: 1, pickup: 26, xp: 1, regen: 0, shieldMax: 0, splatShield: 0
  };
  for (const card of G.cards) {
    const n = nut(card.food);
    if (card.type === 'weapon') {
      if (n.tag === '高碳水') { s.atkSpeed *= 1.10; s.speed *= 1.05; }
      if (n.tag === '高钠') { s.crit += 0.08; s.knock *= 1.30; }
      if (n.tag === '咖啡因') { s.atkSpeed *= 1.08; s.crit += 0.05; }
    } else {
      const lv = card.level, f = b => b * lv * (1 - 0.06 * (lv - 1));
      switch (card.def.id) {
        case 'salad': s.maxHp += f(15 + 8 * n.P); s.regen += f(0.5); break;
        case 'hash': s.atkSpeed *= 1 + f(6 + 4 * n.C) / 100; s.knock *= 1 + f(12 * n.S) / 100; break;
        case 'cola': s.cdr *= Math.pow(0.94, lv); s.speed *= 1 + 0.04 * lv; break;
        case 'flurry': s.pickup *= 1 + 0.22 * lv; s.xp *= 1 + f(8 + 5 * n.C) / 100; break;
        case 'corn': s.shieldMax += f(6 + 4 * n.P); break;
        case 'coffee': s.crit += 0.04 * lv; s.atkSpeed *= 1 + 0.04 * lv; break;
      }
    }
  }
  s.satiety = G.cards.some(c => nut(c.food).tag === '高蛋白');
  G.stats = s;
  for (const w of G.weapons) {
    const c = G.cards.find(x => x.def.id === w.id);
    if (c) w.level = c.level;
  }
  const p = G.player;
  if (p) {
    const d = s.maxHp - p.maxHp;
    p.maxHp = s.maxHp;
    if (d > 0) p.hp = Math.min(p.maxHp, p.hp + d);
    p.hp = Math.min(p.hp, p.maxHp);
  }
}

function wstatsAt(def, lv) {
  const n = nut(def.food), s = G ? G.stats : { atk: 1, atkSpeed: 1, cdr: 1, crit: 0.05 };
  const mul = (1 + 0.25 * (lv - 1)) * (lv >= MAXLV ? 1.25 : 1);
  let dmg = def.dmg * n.dmgMul * mul * s.atk;
  let cd = def.cd * n.cdMul * Math.pow(0.95, lv - 1) * s.cdr / s.atkSpeed;
  let r = def.r * n.rMul * (1 + 0.08 * (lv - 1));
  let cnt = def.n + n.nAdd;
  for (let i = 0; i < lv - 1 && i < def.growth.length; i++) cnt += def.growth[i];
  if (n.tag === '高脂肪') { cnt += 1; r *= 1.15; }
  if (n.tag === '热量炸弹') { dmg *= 1.15; cd *= 1.10; }
  return { dmg, cd: Math.max(0.08, cd), n: cnt, r, crit: s.crit + n.crit, tag: n.tag, evo: lv >= MAXLV };
}

function pool() {

    const c = G.cards.find(x => x.def.id === d.id);
    if (!c) out.push({ type: 'weapon', def: d, level: 1, isNew: true });
    else if (c.level < MAXLV) out.push({ type: 'weapon', def: d, level: c.level + 1, isNew: false });
  }
  for (const d of PDEF) {
    const c = G.cards.find(x => x.def.id === d.id);
    if (!c) out.push({ type: 'passive', def: d, level: 1, isNew: true });
    else if (c.level < MAXLV) out.push({ type: 'passive', def: d, level: c.level + 1, isNew: false });
  }
  return out;
}

function cardStatText(card) {
  if (card.type === 'weapon') {
    const s = wstatsAt(card.def, card.level);
    return '伤害 ' + s.dmg.toFixed(1) + ' · 弹体 ' + s.n + '<br>间隔 ' + s.cd.toFixed(2) + 's · 范围 ' + Math.round(s.r);
  }
  const n = nut(card.def.food), lv = card.level;
  const f = b => b * lv * (1 - 0.06 * (lv - 1));
  const i = card.def.id;
  if (i === 'salad') return '生命 +' + Math.round(f(15 + 8 * n.P)) + '<br>每秒回血 ' + f(0.5).toFixed(1);
  if (i === 'hash') return '攻速 +' + Math.round(f(6 + 4 * n.C)) + '%<br>击退 +' + Math.round(f(12 * n.S)) + '%';
  if (i === 'cola') return '冷却 -' + Math.round((1 - Math.pow(0.94, lv)) * 100) + '%<br>移速 +' + (lv * 4) + '%';
  if (i === 'flurry') return '拾取 +' + Math.round(lv * 22) + '%<br>经验 +' + Math.round(f(8 + 5 * n.C)) + '%';
  if (i === 'corn') return '护盾上限 +' + Math.round(f(6 + 4 * n.P)) + '<br>脱战 3s 回满';
  if (i === 'coffee') return '暴击 +' + (lv * 4) + '%<br>攻速 +' + (lv * 4) + '%';
  return '';
}

function showCards() {
  const p = pool();
  if (!p.length) { G.pending = 0; G.state = 'playing'; return; }

  for (const c of shuffled) { if (chosen.length < 3) chosen.push(c); }
  const hasWeapon = chosen.some(c => c.type === 'weapon');
  const weaponCount = G.cards.filter(c => c.type === 'weapon').length;
  if (!hasWeapon && weaponCount < 6) {
    const w = shuffled.find(c => c.type === 'weapon');
    if (w) chosen[chosen.length - 1] = w;
  }
  G.choices = chosen;
  cardRow.innerHTML = '';
  chosen.forEach((card, i) => {
    const n = nut(card.def.food);

    div.insertAdjacentHTML('beforeend',

    );

  });

}

function chooseCard(i) {
  if (G.state !== 'levelup' || !G.choices) return;
  const card = G.choices[i];
  if (!card) return;
  const existing = G.cards.find(c => c.def.id === card.def.id);
  if (existing) existing.level++;
  else {
    const nc = { type: card.type, def: card.def, food: card.def.food, level: 1 };
    G.cards.push(nc);
    if (card.type === 'weapon') buildWeapon(nc.def);
  }
  if (card.level >= MAXLV) SFX.play('evolve'); else SFX.play('pick');
  recalc();
  refreshSlots();
  cardsEl.classList.add('hide');
  G.choices = null;
  G.pending--;
  if (G.pending > 0) showCards();
  else G.state = 'playing';
}

function buildWeapon(def) {
  const w = { id: def.id, def, t: rnd(0, 0.3), angle: Math.random() * TAU, tick: 0, level: 1 };
  G.weapons.push(w);
  return w;
}

/* ---------- 10. 玩家 ---------- */
function updatePlayer(dt) {
  const p = G.player, s = G.stats;
  let dx = 0, dy = 0;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  const len = hypo(dx, dy) || 1;
  dx /= len; dy /= len;
  if (dx || dy) { p.faceX = dx; p.faceY = dy; p.walk += dt * 8; }
  let sp = s.speed;
  for (const t of TERRAIN) {
    if (t.t === 'spill' && hypo(p.x - t.x, p.y - t.y) < t.r) sp *= 0.72;
  }
  p.x += dx * sp * dt;
  p.y += dy * sp * dt;
  p.x = clamp(p.x, 6, WW - 6);
  p.y = clamp(p.y, 6, WH - 6);
  collideTerrain(p);

  p.inv = Math.max(0, p.inv - dt);
  if (s.regen > 0) p.hp = Math.min(p.maxHp, p.hp + s.regen * dt);
  if (s.shieldMax > 0) {
    p.shieldT = Math.max(0, p.shieldT - dt);
    if (p.shieldT <= 0 && p.shield < s.shieldMax) p.shield = Math.min(s.shieldMax, p.shield + s.shieldMax * 0.6 * dt);
  } else p.shield = 0;
  // 烤架伤害
  for (const t of TERRAIN) {
    if (t.t === 'grill' && Math.abs(p.x - t.x) < t.w / 2 + 3 && Math.abs(p.y - t.y) < t.h / 2 + 3) {
      hurtPlayer(9 * dt, true);
    }
  }
  p.hp = Math.min(p.hp, p.maxHp);
}

function hurtPlayer(dmg, silent) {
  const p = G.player;
  if (p.inv > 0 && !silent) return;
  if (p.shield > 0) {
    const absorb = Math.min(p.shield, dmg);
    p.shield -= absorb; dmg -= absorb;
    p.shieldT = 3;
  }
  if (dmg <= 0) return;
  p.hp -= dmg;
  if (!silent) p.inv = 0.8;
  p.shieldT = 3;
  G.shake = Math.min(1, G.shake + 0.35);
  G.hurtT = 0.3;
  SFX.play('hurt');
  if (!silent) { el('hurt').style.opacity = 0.9; setTimeout(() => el('hurt').style.opacity = 0, 60); }
  if (p.hp <= 0) { p.hp = 0; endGame('dead'); }
}

function collideTerrain(o) {
  for (const t of TERRAIN) {
    if (t.t === 'table') {
      const dx = o.x - t.x, dy = o.y - t.y, d = hypo(dx, dy), min = t.r + o.r;
      if (d < min && d > 0.001) { o.x = t.x + dx / d * min; o.y = t.y + dy / d * min; }
    } else if (t.t === 'tray' && !t.dead) {
      const hw = t.w / 2, hh = t.h / 2;
      const nx = clamp(o.x, t.x - hw, t.x + hw), ny = clamp(o.y, t.y - hh, t.y + hh);
      const dx = o.x - nx, dy = o.y - ny, d = hypo(dx, dy);
      if (d < o.r) {
        if (d > 0.001) { o.x = nx + dx / d * o.r; o.y = ny + dy / d * o.r; }
        else o.y = t.y - hh - o.r;
      }
    }
  }
}

/* ---------- 11. 武器 ---------- */
function nearestEnemy(x, y) {
  let best = null, bd = 1e9;
  for (const e of G.enemies) {
    if (e.dead) continue;
    const d = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y);
    if (d < bd) { bd = d; best = e; }
  }
  if (G.boss && G.boss.alive) {
    const d = (G.boss.x - x) * (G.boss.x - x) + (G.boss.y - y) * (G.boss.y - y);
    if (d < bd) { bd = d; best = G.boss; }
  }
  return best;
}

function updateWeapons(dt) {
  const p = G.player;
  for (const w of G.weapons) {
    const st = wstatsAt(w.def, w.level);
    if (w.id === 'ring') {
      w.angle += dt * 2.4;
      w.tick -= dt;
      const orbs = [];
      for (let i = 0; i < st.n; i++) {
        const a = w.angle + i * TAU / st.n;
        orbs.push({ x: p.x + Math.cos(a) * st.r, y: p.y + Math.sin(a) * st.r });
      }
      w.orbs = orbs;
      if (w.tick <= 0) {
        w.tick = 0.1;
        for (const e of G.enemies) {
          if (e.dead) continue;
          for (const o of orbs) {
            if (hypo(e.x - o.x, e.y - o.y) < 9 + e.r) {
              if (e.ringCd === undefined || e.ringCd <= 0) {
                e.ringCd = 0.5;
                hitEnemy(e, st.dmg, st.crit, Math.atan2(e.y - o.y, e.x - o.x), 12);
                break;
              }
            }
          }
        }
        if (G.boss && G.boss.alive) {
          for (const o of orbs) {
            if (hypo(G.boss.x - o.x, G.boss.y - o.y) < 10 + G.boss.r) {
              if (G.boss.ringCd === undefined || G.boss.ringCd <= 0) {
                G.boss.ringCd = 0.5;
                hitEnemy(G.boss, st.dmg, st.crit, 0, 0);
                break;
              }
            }
          }
        }
      }
      continue;
    }
    w.t -= dt;
    if (w.t > 0) continue;
    w.t = st.cd;

    if (w.id === 'shot') {
      const tgt = nearestEnemy(p.x, p.y);
      const base = tgt ? Math.atan2(tgt.y - p.y, tgt.x - p.x) : Math.atan2(p.faceY, p.faceX);
      const spread = 0.9;
      for (let i = 0; i < st.n; i++) {
        const a = base + (st.n === 1 ? 0 : (i / (st.n - 1) - 0.5) * spread) + rnd(-0.05, 0.05);
        G.bullets.push({
          x: p.x, y: p.y, vx: Math.cos(a) * 195, vy: Math.sin(a) * 195,
          r: 2, dmg: st.dmg, crit: st.crit, life: st.r / 195, kind: 'fry', angle: a
        });
      }
      p.x -= Math.cos(base) * 1.2; p.y -= Math.sin(base) * 1.2;
      SFX.play('shot');
    } else if (w.id === 'home') {
      const tgt = nearestEnemy(p.x, p.y);
      const base = tgt ? Math.atan2(tgt.y - p.y, tgt.x - p.x) : Math.atan2(p.faceY, p.faceX);
      for (let i = 0; i < st.n; i++) {
        const a = base + (i - (st.n - 1) / 2) * 0.4;
        G.bullets.push({
          x: p.x, y: p.y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90,
          r: 3, dmg: st.dmg, crit: st.crit, life: 2.4, kind: 'nugget',
          homing: true, target: tgt, speed: 135
        });
      }
      SFX.play('shot');
    } else if (w.id === 'dash') {
      const tgt = nearestEnemy(p.x, p.y);
      let a = tgt ? Math.atan2(tgt.y - p.y, tgt.x - p.x) : Math.atan2(p.faceY, p.faceX);
      const dist = st.r;
      const ex = p.x + Math.cos(a) * dist, ey = p.y + Math.sin(a) * dist;
      // 沿途伤害
      const steps = 8;
      const hitSet = new Set();
      for (let i = 0; i <= steps; i++) {
        const hx = lerp(p.x, ex, i / steps), hy = lerp(p.y, ey, i / steps);
        for (const e of G.enemies) {
          if (e.dead || hitSet.has(e)) continue;
          if (hypo(e.x - hx, e.y - hy) < 12 + e.r) {
            hitSet.add(e);
            hitEnemy(e, st.dmg, st.crit, a, 22, true);
          }
        }
        if (G.boss && G.boss.alive && !hitSet.has(G.boss) && hypo(G.boss.x - hx, G.boss.y - hy) < 16 + G.boss.r) {
          hitSet.add(G.boss);
          hitEnemy(G.boss, st.dmg, st.crit, 0, 0);
        }
      }
      G.zones.push({ x: ex, y: ey, r: 16, t: 0, life: 1.2, dmg: st.dmg * 0.35, tick: 0 });
      p.x = clamp(ex, 6, WW - 6); p.y = clamp(ey, 6, WH - 6);
      p.inv = Math.max(p.inv, 0.2);
      for (let i = 0; i < 10; i++) {
        G.parts.push({ x: p.x - Math.cos(a) * i * 3, y: p.y - Math.sin(a) * i * 3, vx: rnd(-20, 20), vy: rnd(-20, 20), life: 0.35, max: 0.35, c: '#ffffff', s: 2 });
      }
      G.shake = Math.min(1, G.shake + 0.3);
      G.hitstop = Math.max(G.hitstop, 0.05);
      SFX.play('dash');
    } else if (w.id === 'pie') {
      const tgt = nearestEnemy(p.x, p.y);
      const tx = tgt ? tgt.x : p.x + p.faceX * 60, ty = tgt ? tgt.y : p.y + p.faceY * 60;
      for (let i = 0; i < 1; i++) {
        const ox = i === 0 ? 0 : rnd(-40, 40), oy = i === 0 ? 0 : rnd(-40, 40);
        G.bullets.push({
          x: p.x, y: p.y, sx: p.x, sy: p.y, tx: tx + ox, ty: ty + oy,
          t: 0, dur: 0.5 + i * 0.08, kind: 'pie', dmg: st.dmg, crit: st.crit,
          radius: st.r, r: 3, life: 1
        });
      }
      SFX.play('shot');
    } else if (w.id === 'wave') {
      G.rings.push({
        x: p.x, y: p.y, r: 8, max: st.r, t: 0, life: 0.42,
        dmg: st.dmg, crit: st.crit, hit: new Set(), friendly: true, width: 5
      });
      SFX.play('warn');
    }
  }
}

function updateBullets(dt) {
  for (const b of G.bullets) {
    if (b.kind === 'pie') {
      b.t += dt;
      const k = Math.min(1, b.t / b.dur);
      b.x = lerp(b.sx, b.tx, k);
      b.y = lerp(b.sy, b.ty, k) - Math.sin(k * Math.PI) * 26;
      if (k >= 1) {
        b.dead = true;
        explode(b.tx, b.ty, b.radius, b.dmg, b.crit);
      }
      continue;
    }
    if (b.homing) {
      if (b.target && !b.target.dead) {
        const want = Math.atan2(b.target.y - b.y, b.target.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let d = want - cur;
        while (d > Math.PI) d -= TAU;
        while (d < -Math.PI) d += TAU;
        const na = cur + clamp(d, -3.4 * dt, 3.4 * dt);
        b.vx = Math.cos(na) * b.speed;
        b.vy = Math.sin(na) * b.speed;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > WW + 20 || b.y < -20 || b.y > WH + 20) b.dead = true;
    if (!b.dead) {
      for (const e of G.enemies) {
        if (e.dead) continue;
        if (hypo(e.x - b.x, e.y - b.y) < e.r + b.r) {
          hitEnemy(e, b.dmg, b.crit, Math.atan2(b.vy, b.vx), b.kind === 'nugget' ? 12 : 7);
          b.dead = true; break;
        }
      }
      if (!b.dead && G.boss && G.boss.alive && hypo(G.boss.x - b.x, G.boss.y - b.y) < G.boss.r + b.r) {
        hitEnemy(G.boss, b.dmg, b.crit, 0, 0);
        b.dead = true;
      }
      if (!b.dead) damageTrays(b.x, b.y, b.r, b.dmg);
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);
}

function explode(x, y, radius, dmg, crit) {
  G.rings.push({ x, y, r: 4, max: radius, t: 0, life: 0.3, dmg, crit, hit: new Set(), friendly: true, width: 6 });
  for (const e of G.enemies) {
    if (!e.dead && hypo(e.x - x, e.y - y) < radius + e.r) hitEnemy(e, dmg, crit, Math.atan2(e.y - y, e.x - x), 16, true);
  }
  if (G.boss && G.boss.alive && hypo(G.boss.x - x, G.boss.y - y) < radius + G.boss.r) hitEnemy(G.boss, dmg, crit, 0, 0);
  damageTrays(x, y, radius, 12);
  burst(x, y, 12, C.white);
  G.shake = Math.min(1, G.shake + 0.28);
  G.hitstop = Math.max(G.hitstop, 0.05);
  SFX.play('boom');
}

function damageTrays(x, y, r, dmg) {
  for (const t of TERRAIN) {
    if (t.t !== 'tray' || t.dead) continue;
    if (Math.abs(x - t.x) < t.w / 2 + r && Math.abs(y - t.y) < t.h / 2 + r) {
      t.hp -= dmg;
      if (t.hp <= 0) {
        t.dead = true;
        for (let i = 0; i < 3; i++) dropGem(t.x + rnd(-14, 14), t.y + rnd(-10, 10), 3);
        burst(t.x, t.y, 14, '#b8ab92');
        G.shake = Math.min(1, G.shake + 0.2);
        SFX.play('boom');
      }
    }
  }
}

/* ---------- 12. 伤害 / 击杀 ---------- */
function hitEnemy(e, dmg, critChance, dir, knock, heavy) {
  if (e.dead) return;
  const isCrit = Math.random() < (critChance || 0);
  let d = dmg * (isCrit ? 2 : 1);
  if (e.type === 'elite') {
    const diff = Math.abs(((dir - e.shieldAngle + Math.PI * 3) % TAU) - Math.PI);
    if (diff < 1.05) { d *= 0.4; }
  }
  if (e.type === 'boss' && e.phase === 2) d *= 1.0;
  e.hp -= d;
  e.flash = 0.06;
  const kb = (knock || 0) * G.stats.knock * (e.type === 'elite' ? 0.3 : e.type === 'boss' ? 0 : 1);
  if (kb) { e.kx += Math.cos(dir) * kb; e.ky += Math.sin(dir) * kb; }
  popText(e.x + rnd(-3, 3), e.y - e.r - 4, Math.round(d), isCrit);
  burst(e.x, e.y, isCrit ? 6 : 3, isCrit ? C.gold : C.white, isCrit ? 2 : 1);
  G.shake = Math.min(1, G.shake + (isCrit ? 0.09 : 0.05));
  G.hitstop = Math.max(G.hitstop, heavy ? 0.055 : 0.028);
  SFX.play(isCrit ? 'crit' : 'hit');
  if (G.stats.satiety) G.player.shield = Math.min(20, G.player.shield + 0.6);
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  G.kills++;
  burst(e.x, e.y, 8, C.light, 1);
  if (e.type === 'boss') {
    e.alive = false;
    el('bossbar').classList.add('hide');
    G.bossDeadT = G.t;
    G.hitstop = 0.5;
    G.shake = 1;
    burst(e.x, e.y, 40, C.gold, 2);
    SFX.play('evolve');
    for (let i = 0; i < 10; i++) dropGem(e.x + rnd(-30, 30), e.y + rnd(-30, 30), 3);
    setTimeout(() => endGame('win'), 600);
    return;
  }
  SFX.play('kill');
  if (e.type === 'elite') {
    G.hitstop = Math.max(G.hitstop, 0.14);
    G.shake = Math.min(1, G.shake + 0.45);
    for (let i = 0; i < 4; i++) dropGem(e.x + rnd(-16, 16), e.y + rnd(-16, 16), 3);
  } else if (e.type === 'patty' && e.split) {
    for (let i = 0; i < 2; i++) spawnEnemy('mini', e.x + rnd(-8, 8), e.y + rnd(-8, 8));
  } else {
    dropGem(e.x, e.y, e.xp);
  }
}

function dropGem(x, y, value) {
  G.gems.push({ x, y, value, t: 0, vx: rnd(-30, 30), vy: rnd(-30, 30), pulled: false });
}

function popText(x, y, val, crit) {
  if (G.texts.length > 44) G.texts.shift();
  G.texts.push({ x, y, v: String(val), t: 0, life: 0.55, crit, vy: crit ? -26 : -18 });
}

function burst(x, y, n, color, size) {
  for (let i = 0; i < n; i++) {
    if (G.parts.length > 300) G.parts.shift();
    const a = rnd(0, TAU), sp = rnd(20, 90);
    G.parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rnd(0.2, 0.5), max: 0.5, c: color, s: size || 1
    });
  }
}

/* ---------- 13. 敌人 ---------- */
function spawnEnemy(type, x, y) {
  const d = EDEF[type];
  const mul = type === 'elite' ? 1 : 1 + 0.12 * Math.min(6, G.t / 60);
  const e = {
    type, x, y, hp: d.hp * mul, maxHp: d.hp * mul, r: d.r, speed: d.speed,
    kx: 0, ky: 0, flash: 0, dead: false, xp: d.xp, dmg: d.dmg,
    st: 0, t: rnd(0, 2), t2: rnd(0.6, 1.6), phase: rnd(0, TAU), split: type === 'patty',
    shieldAngle: type === 'elite' ? 0 : undefined, ringCd: 0
  };
  if (type === 'elite') { e.maxHp = e.hp = 260 + G.t * 0.8; }
  G.enemies.push(e);
  return e;
}

function spawnPoint() {
  for (let tries = 0; tries < 12; tries++) {
    const a = rnd(0, TAU), d = rnd(150, 260);
    const x = clamp(G.player.x + Math.cos(a) * d, 16, WW - 16);
    const y = clamp(G.player.y + Math.sin(a) * d, 16, WH - 16);
    let ok = true;
    for (const t of TERRAIN) {
      if (t.t === 'table' && hypo(x - t.x, y - t.y) < t.r + 12) ok = false;
      if (t.t === 'tray' && !t.dead && Math.abs(x - t.x) < t.w / 2 + 10 && Math.abs(y - t.y) < t.h / 2 + 10) ok = false;
    }
    if (ok) return { x, y };
  }
  return { x: rnd(30, WW - 30), y: 24 };
}

function typeForTime() {
  const t = G.t;
  const r = Math.random();
  if (t < 30) return 'fries';
  if (t < 60) return r < 0.7 ? 'fries' : 'straw';
  if (t < 120) return r < 0.5 ? 'fries' : r < 0.78 ? 'straw' : 'nugget';
  return r < 0.35 ? 'fries' : r < 0.58 ? 'straw' : r < 0.8 ? 'nugget' : 'patty';
}

function updateSpawn(dt) {
  if (G.bossSpawned) {
    // Boss 战中仍有少量小怪
  }
  let row = SPAWN_TABLE[0];
  for (const r of SPAWN_TABLE) if (G.t >= r.t) row = r;
  const cap = G.bossSpawned ? 24 : row.cap;
  if (!G.bossSpawned) {
    G.spawnAcc += row.rate * dt;
    while (G.spawnAcc >= 1) {
      G.spawnAcc -= 1;
      if (G.enemies.length < cap) {
        const p = spawnPoint();
        spawnEnemy(typeForTime(), p.x, p.y);
      }
    }
    if (G.t > G.nextBurst) {
      G.nextBurst += 20;
      const n = 8;
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU;
        const p = { x: G.player.x + Math.cos(a) * 170, y: G.player.y + Math.sin(a) * 170 };
        p.x = clamp(p.x, 12, WW - 12); p.y = clamp(p.y, 12, WH - 12);
        spawnEnemy('fries', p.x, p.y);
      }
    }
  }
  // 精英
  G.eliteAt.forEach((at, i) => {
    if (!G.eliteDone[i] && G.t >= at) {
      G.eliteDone[i] = true;
      const p = spawnPoint();
      spawnEnemy('elite', p.x, p.y);
      G.hitstop = Math.max(G.hitstop, 0.1);
      G.shake = Math.min(1, G.shake + 0.4);
      SFX.play('boss');
    }
  });
  // Boss
  if (!G.bossSpawned && G.t >= 240) spawnBoss();
}

function updateEnemies(dt) {
  const p = G.player;
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt);
    e.ringCd = Math.max(0, (e.ringCd || 0) - dt);
    e.t += dt;
    if (e.type === 'elite') e.shieldAngle += dt * 0.85;
    const dx = p.x - e.x, dy = p.y - e.y;
    const d = hypo(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    let vx = 0, vy = 0;

    if (e.type === 'fries' || e.type === 'mini') {
      const wob = Math.sin(e.t * 4 + e.phase) * 0.35;
      vx = nx - ny * wob; vy = ny + nx * wob;
      vx *= e.speed; vy *= e.speed;
    } else if (e.type === 'straw') {
      if (d > 110) { vx = nx * e.speed; vy = ny * e.speed; }
      else if (d < 75) { vx = -nx * e.speed * 0.8; vy = -ny * e.speed * 0.8; }
      else { vx = -ny * e.speed * 0.4; vy = nx * e.speed * 0.4; }
      e.t2 = (e.t2 || 0) - dt;
      if (e.t2 <= 0) {
        e.t2 = 2.0;
        e.charge = 0.45;
      }
      if (e.charge > 0) {
        e.charge -= dt;
        if (e.charge <= 0) {
          G.ebullets.push({ x: e.x, y: e.y, vx: nx * 105, vy: ny * 105, r: 2, dmg: 6, life: 2.4 });
          SFX.play('shot');
        }
      }
    } else if (e.type === 'nugget') {
      if (e.st === 0) {
        vx = nx * e.speed * 0.55; vy = ny * e.speed * 0.55;
        if (e.t > 2.6 && d < 150) { e.st = 1; e.t = 0; e.ax = nx; e.ay = ny; }
      } else if (e.st === 1) {
        if (e.t < 0.55) { vx = 0; vy = 0; }
        else if (e.t < 0.95) { vx = e.ax * 150; vy = e.ay * 150; }
        else { e.st = 2; e.t = 0; }
      } else {
        if (e.t > 0.7) { e.st = 0; e.t = 0; }
      }
    } else if (e.type === 'patty') {
      vx = nx * e.speed; vy = ny * e.speed;
    } else if (e.type === 'elite') {
      vx = nx * e.speed; vy = ny * e.speed;
      e.t2 = (e.t2 || 0) - dt;
      if (e.t2 <= 0 && d < 90) {
        e.t2 = 4.2;
        e.slam = 0.9;
        e.sx = p.x; e.sy = p.y;
      }
      if (e.slam > 0) {
        e.slam -= dt;
        vx *= 0.2; vy *= 0.2;
        if (e.slam <= 0) {
          G.rings.push({ x: e.sx, y: e.sy, r: 6, max: 58, t: 0, life: 0.35, dmg: 14, crit: 0, hit: new Set(), friendly: false, width: 8 });
          G.shake = Math.min(1, G.shake + 0.45);
          SFX.play('boom');
        }
      }
    }

    e.x += (vx + e.kx) * dt;
    e.y += (vy + e.ky) * dt;
    e.kx *= Math.pow(0.02, dt);
    e.ky *= Math.pow(0.02, dt);
    e.x = clamp(e.x, 4, WW - 4);
    e.y = clamp(e.y, 4, WH - 4);
    collideTerrain(e);

    // 烤架
    for (const t of TERRAIN) {
      if (t.t === 'grill' && Math.abs(e.x - t.x) < t.w / 2 && Math.abs(e.y - t.y) < t.h / 2) {
        e.hp -= 4 * dt;
        if (e.hp <= 0) killEnemy(e);
      }
      if (t.t === 'spill' && hypo(e.x - t.x, e.y - t.y) < t.r) e.slow = true;
    }

    // 与玩家保持最小间距 + 接触伤害
    const pd = hypo(e.x - p.x, e.y - p.y);
    const minD = e.r + p.r + 1.5;
    if (pd < minD) {
      const nx2 = (e.x - p.x) / (pd || 1), ny2 = (e.y - p.y) / (pd || 1);
      e.x = p.x + nx2 * minD;
      e.y = p.y + ny2 * minD;
      if (!e.dead) hurtPlayer(e.dmg);
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
}

function updateEBullets(dt) {
  const p = G.player;
  for (const b of G.ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0) b.dead = true;
    if (hypo(b.x - p.x, b.y - p.y) < b.r + p.r) {
      hurtPlayer(b.dmg);
      b.dead = true;
    }
  }
  G.ebullets = G.ebullets.filter(b => !b.dead);
}

function updateGems(dt) {
  const p = G.player;
  for (const g of G.gems) {
    g.t += dt;
    const d = hypo(p.x - g.x, p.y - g.y);
    if (d < G.stats.pickup) g.pulled = true;
    if (g.pulled) {
      const a = Math.atan2(p.y - g.y, p.x - g.x);
      const sp = 120 + g.t * 220;
      g.x += Math.cos(a) * sp * dt;
      g.y += Math.sin(a) * sp * dt;
    } else {
      g.x += g.vx * dt; g.y += g.vy * dt;
      g.vx *= Math.pow(0.02, dt); g.vy *= Math.pow(0.02, dt);
    }
    if (d < 8) {
      g.dead = true;
      G.xp += g.value * G.stats.xp;
      SFX.play('pick');
      while (G.xp >= G.xpNext) {
        G.xp -= G.xpNext;
        G.level++;
        G.xpNext = 12 + 10 * (G.level - 1);
        G.pending++;
      }
      if (G.pending > 0 && G.state === 'playing') showCards();
    }
  }
  G.gems = G.gems.filter(g => !g.dead);
}

/* ---------- 14. Boss ---------- */
function spawnBoss() {
  G.bossSpawned = true;
  SFX.play('boss');
  G.boss = {
    type: 'boss', alive: true, x: WW / 2, y: 90, r: 15,
    hp: 2600, maxHp: 2600, phase: 1, mode: 'enter', t: 1.4, cd: 1.6,
    flash: 0, angle: 0, tx: 0, ty: 0, dashT: 0, dashes: 0, ringCd: 0, dead: false
  };
  for (const e of G.enemies) { e.dead = true; burst(e.x, e.y, 3, C.light); }
  G.enemies.length = 0;
  G.shake = 0.9;
  G.hitstop = 0.25;
  el('bossbar').classList.remove('hide');
  el('redflash').style.opacity = '1';
  setTimeout(() => { el('redflash').style.opacity = '0'; }, 260);
  G.state = 'playing';
}

function updateBoss(dt) {
  const b = G.boss;
  if (!b || !b.alive) return;
  const p = G.player;
  b.flash = Math.max(0, b.flash - dt);
  b.ringCd = Math.max(0, b.ringCd - dt);
  b.angle += dt * 0.6;
  const spd = b.phase === 2 ? 40 : 30;
  const dx = p.x - b.x, dy = p.y - b.y, d = hypo(dx, dy) || 1;

  if (b.mode === 'enter') {
    b.t -= dt;
    b.y += 24 * dt;
    if (b.t <= 0) { b.mode = 'idle'; b.cd = 1.2; }
    return;
  }
  if (b.mode === 'idle') {
    b.x += (dx / d) * spd * dt * 0.35;
    b.y += (dy / d) * spd * dt * 0.35;
    b.cd -= dt;
    if (b.cd <= 0) {
      b.attack = (b.attack || 0) + 1;
      const order = ['ring', 'slam', 'summon', 'slam', 'ring'];
      let act = order[(b.attack - 1) % order.length];
      if (b.phase === 2 && b.attack % 3 === 0) act = 'charge';
      b.mode = act;
      b.t = act === 'summon' ? 0.7 : act === 'charge' ? 0.7 : 0.9;
      b.total = b.t;
      b.tx = p.x; b.ty = p.y;
      SFX.play('warn');
    }
    return;
  }
  // 招式执行
  if (b.mode === 'ring') {
    b.t -= dt;
    if (b.t > 0) return;
    const n = 16;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + b.angle;
      G.ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 72, vy: Math.sin(a) * 72, r: 3, dmg: 8, life: 4 });
    }
    SFX.play('boom');
    b.mode = 'idle'; b.cd = b.phase === 2 ? 1.15 : 1.7;
  } else if (b.mode === 'slam') {
    b.t -= dt;
    b.tx = lerp(b.tx, p.x, 0.08);
    b.ty = lerp(b.ty, p.y, 0.08);
    if (b.t > 0) return;
    G.rings.push({ x: b.tx, y: b.ty, r: 8, max: 56, t: 0, life: 0.4, dmg: 18, crit: 0, hit: new Set(), friendly: false, width: 9 });
    G.shake = 0.8;
    G.hitstop = Math.max(G.hitstop, 0.06);
    SFX.play('boom');
    b.mode = 'idle'; b.cd = b.phase === 2 ? 1.2 : 1.8;
  } else if (b.mode === 'summon') {
    b.t -= dt;
    if (b.t > 0) return;
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU;
      spawnEnemy('fries', clamp(b.x + Math.cos(a) * 70, 12, WW - 12), clamp(b.y + Math.sin(a) * 70, 12, WH - 12));
    }
    G.shake = 0.3;
    b.mode = 'idle'; b.cd = 1.6;
  } else if (b.mode === 'charge') {
    if (b.dashT <= 0 && b.dashes < 3) {
      b.t -= dt;
      b.tx = p.x; b.ty = p.y;
      if (b.t <= 0) {
        const a = Math.atan2(b.ty - b.y, b.tx - b.x);
        b.dvx = Math.cos(a) * 230; b.dvy = Math.sin(a) * 230;
        b.dashT = 0.32; b.dashes++;
        SFX.play('dash');
      }
    } else if (b.dashT > 0) {
      b.dashT -= dt;
      b.x += b.dvx * dt; b.y += b.dvy * dt;
      if (hypo(b.x - p.x, b.y - p.y) < b.r + p.r) hurtPlayer(20);
      if (b.x < 20 || b.x > WW - 20 || b.y < 20 || b.y > WH - 20) b.dashT = 0;
      if (b.dashT <= 0 && b.dashes >= 3) {
        b.mode = 'idle'; b.cd = 1.5; b.dashes = 0;
      } else if (b.dashT <= 0) { b.t = 0.3; }
    }
    b.x = clamp(b.x, 20, WW - 20); b.y = clamp(b.y, 20, WH - 20);
  }
  if (b.phase === 1 && b.hp <= b.maxHp * 0.5) {
    b.phase = 2;
    b.cd = 0.8;
    G.hitstop = 0.3;
    G.shake = 1;
    SFX.play('boss');
    el('redflash').style.opacity = '1';
    setTimeout(() => { el('redflash').style.opacity = '0'; }, 300);
    burst(b.x, b.y, 24, C.red, 2);
  }
}

/* ---------- 15. 通用更新 ---------- */
function updateRings(dt) {
  const p = G.player;
  for (const r of G.rings) {
    r.t += dt;
    const k = Math.min(1, r.t / r.life);
    r.r = lerp(4, r.max, k);
    if (r.friendly) {
      for (const e of G.enemies) {
        if (e.dead || r.hit.has(e)) continue;
        if (Math.abs(hypo(e.x - r.x, e.y - r.y) - r.r) < 10 + e.r) {
          r.hit.add(e);
          hitEnemy(e, r.dmg, r.crit, Math.atan2(e.y - r.y, e.x - r.x), 14);
        }
      }
      if (G.boss && G.boss.alive && !r.hit.has(G.boss) && Math.abs(hypo(G.boss.x - r.x, G.boss.y - r.y) - r.r) < 12 + G.boss.r) {
        r.hit.add(G.boss);
        hitEnemy(G.boss, r.dmg, r.crit, 0, 0);
      }
    } else {
      if (!r.hit.has('p') && Math.abs(hypo(p.x - r.x, p.y - r.y) - r.r) < 10) {
        r.hit.add('p');
        hurtPlayer(r.dmg);
      }
    }
    if (k >= 1) r.dead = true;
  }
  G.rings = G.rings.filter(r => !r.dead);

  for (const z of G.zones) {
    z.t += dt;
    z.tick = (z.tick || 0) - dt;
    if (z.tick <= 0) {
      z.tick = 0.3;
      for (const e of G.enemies) {
        if (!e.dead && hypo(e.x - z.x, e.y - z.y) < z.r + e.r) hitEnemy(e, z.dmg, 0, Math.atan2(e.y - z.y, e.x - z.x), 2);
      }
      if (G.boss && G.boss.alive && hypo(G.boss.x - z.x, G.boss.y - z.y) < z.r + G.boss.r) hitEnemy(G.boss, z.dmg, 0, 0, 0);
    }
    if (z.t >= z.life) z.dead = true;
  }
  G.zones = G.zones.filter(z => !z.dead);

  for (const pt of G.parts) {
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= Math.pow(0.06, dt); pt.vy *= Math.pow(0.06, dt);
    pt.life -= dt;
    if (pt.life <= 0) pt.dead = true;
  }
  G.parts = G.parts.filter(p => !p.dead);

  for (const t of G.texts) {
    t.t += dt;
    t.y += t.vy * dt;
    t.vy *= Math.pow(0.2, dt);
    if (t.t >= t.life) t.dead = true;
  }
  G.texts = G.texts.filter(t => !t.dead);

  G.shake = Math.max(0, G.shake - dt * 1.9);
  G.hurtT = Math.max(0, G.hurtT - dt);
}

function step(dt) {
  G.t += dt;
  updatePlayer(dt);
  updateSpawn(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateWeapons(dt);
  updateBullets(dt);
  updateEBullets(dt);
  updateRings(dt);
  updateGems(dt);
  if (G.t >= 300 && G.state === 'playing') endGame('time');
}

/* ---------- 16. 渲染 ---------- */
function drawFloor() {
  ctx.fillStyle = C.floor;
  ctx.fillRect(0, 0, WW, WH);
  ctx.fillStyle = C.floor2;
  for (let y = 0; y < WH; y += 32) {
    for (let x = 0; x < WW; x += 32) {
      if (((x / 32) + (y / 32)) % 2 === 0) ctx.fillRect(x, y, 32, 32);
    }
  }
  ctx.fillStyle = C.line;
  for (let x = 0; x <= WW; x += 32) ctx.fillRect(x, 0, 1, WH);
  for (let y = 0; y <= WH; y += 32) ctx.fillRect(0, y, WW, 1);
  // 场地边框
  ctx.fillStyle = '#262626';
  ctx.fillRect(0, 0, WW, 4);
  ctx.fillRect(0, WH - 4, WW, 4);
  ctx.fillRect(0, 0, 4, WH);
  ctx.fillRect(WW - 4, 0, 4, WH);
}

function drawTerrain() {
  for (const t of TERRAIN) {
    if (t.t === 'table') {
      ctx.fillStyle = '#0f0f0f';
      ctx.beginPath(); ctx.arc(t.x + 2, t.y + 3, t.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3a3a3a';
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#4e4e4e';
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r - 3, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2c2c2c';
      ctx.fillRect(t.x - t.r + 5, t.y - 1, (t.r - 5) * 2, 2);
    } else if (t.t === 'tray') {
      if (t.dead) continue;
      ctx.fillStyle = '#101010';
      ctx.fillRect(t.x - t.w / 2 + 2, t.y - t.h / 2 + 3, t.w, t.h);
      ctx.fillStyle = '#3d3d3d';
      ctx.fillRect(t.x - t.w / 2, t.y - t.h / 2, t.w, t.h);
      ctx.strokeStyle = '#5a5a5a';
      ctx.lineWidth = 1;
      ctx.strokeRect(t.x - t.w / 2 + 3.5, t.y - t.h / 2 + 3.5, t.w - 7, t.h - 7);
      const dmgK = 1 - Math.max(0, t.hp) / 30;
      if (dmgK > 0.2) {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(t.x - 6, t.y - 4, 4, 2);
        ctx.fillRect(t.x + 4, t.y + 3, 5, 2);
      }
    } else if (t.t === 'grill') {
      const wob = Math.sin(performance.now() / 260) * 1;
      ctx.fillStyle = 'rgba(255,199,44,0.10)';
      ctx.fillRect(t.x - t.w / 2 - 2, t.y - t.h / 2 - 2 + wob, t.w + 4, t.h + 4);
      ctx.fillStyle = '#242424';
      ctx.fillRect(t.x - t.w / 2, t.y - t.h / 2, t.w, t.h);
      ctx.fillStyle = '#4a4a4a';
      for (let i = -t.h / 2 + 3; i < t.h / 2; i += 4) ctx.fillRect(t.x - t.w / 2 + 3, t.y + i, t.w - 6, 2);
      ctx.fillStyle = 'rgba(218,41,28,0.5)';
      ctx.fillRect(t.x - t.w / 2 + 4, t.y + t.h / 2 - 5 + wob, t.w - 8, 1);
    } else if (t.t === 'spill') {
      ctx.fillStyle = 'rgba(60,60,60,0.55)';
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(140,140,140,0.18)';
      ctx.beginPath(); ctx.arc(t.x - 5, t.y - 6, t.r * 0.45, 0, TAU); ctx.fill();
    }
  }
}

function drawEnemy(e) {
  const white = e.flash > 0;
  if (e.type === 'fries') drawSpr(SPR.fries, e.x, e.y, white, Math.sin(e.t * 6) > 0);
  else if (e.type === 'straw') drawSpr(SPR.straw, e.x, e.y, white);
  else if (e.type === 'nugget') {
    if (e.st === 1 && e.t < 0.55) {
      ctx.strokeStyle = 'rgba(218,41,28,0.8)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, TAU); ctx.stroke();
    }
    drawSpr(SPR.nugget, e.x, e.y, white);
  }
  else if (e.type === 'patty') drawSpr(SPR.patty, e.x, e.y, white);
  else if (e.type === 'mini') drawSpr(SPR.mini, e.x, e.y, white);
  else if (e.type === 'elite') {
    if (e.slam > 0) {
      ctx.fillStyle = 'rgba(218,41,28,0.16)';
      ctx.beginPath(); ctx.arc(e.sx, e.sy, 58, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(218,41,28,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.sx, e.sy, 58 * (1 - e.slam / 0.9), 0, TAU); ctx.stroke();
    }
    burgerShape(e.x, e.y, 16, 13, white);
    // 护盾弧
    ctx.strokeStyle = white ? '#fff' : 'rgba(232,228,218,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 11, e.shieldAngle - 1.05, e.shieldAngle + 1.05);
    ctx.stroke();
  }
  if (e.hp < e.maxHp) {
    const w = e.type === 'elite' ? 20 : e.r * 2 + 2;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 6, w, 2);
    ctx.fillStyle = C.white;
    ctx.fillRect(e.x - w / 2, e.y - e.r - 6, w * clamp(e.hp / e.maxHp, 0, 1), 1);
  }
}

function drawBoss() {
  const b = G.boss;
  if (!b || !b.alive) return;
  const white = b.flash > 0;
  const tel = b.mode !== 'idle' && b.mode !== 'enter' && b.t > 0;
  if (tel) {
    const k = 1 - b.t / (b.total || 1);
    if (b.mode === 'slam') {
      ctx.fillStyle = 'rgba(218,41,28,0.14)';
      ctx.beginPath(); ctx.arc(b.tx, b.ty, 58, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(218,41,28,0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.tx, b.ty, 58 * clamp(k, 0, 1), 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(b.tx, b.ty, 58, 0, TAU); ctx.stroke();
    } else if (b.mode === 'ring') {
      ctx.strokeStyle = 'rgba(218,41,28,' + (0.35 + 0.4 * Math.sin(b.t * 30)) + ')';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.arc(b.x, b.y, 34, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    } else if (b.mode === 'charge') {
      const a = Math.atan2(p_y() - b.y, p_x() - b.x);
      ctx.strokeStyle = 'rgba(218,41,28,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + Math.cos(a) * 300, b.y + Math.sin(a) * 300); ctx.stroke();
    }
  }
  if (b.phase === 2) {
    ctx.fillStyle = 'rgba(218,41,28,0.12)';
    ctx.beginPath(); ctx.arc(b.x, b.y + 4, 26 + Math.sin(performance.now() / 200) * 2, 0, TAU); ctx.fill();
  }
  burgerShape(b.x, b.y, 32, 26, white);
  // 金拱头冠
  ctx.fillStyle = C.gold;
  ctx.fillRect(b.x - 9, b.y - 19, 3, 5);
  ctx.fillRect(b.x - 4, b.y - 22, 3, 8);
  ctx.fillRect(b.x + 2, b.y - 19, 3, 5);
  if (b.phase === 2) {
    ctx.fillStyle = C.red;
    ctx.fillRect(b.x - 7, b.y - 3, 3, 2);
    ctx.fillRect(b.x + 4, b.y - 3, 3, 2);
  }
}
function p_x() { return G.player.x; }
function p_y() { return G.player.y; }

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (!G) { renderMenuBg(); return; }

  const sh = G.shake * G.shake * 7;
  const sx = rnd(-sh, sh), sy = rnd(-sh, sh);
  ctx.save();
  ctx.translate(Math.round(-G.cam.x + sx), Math.round(-G.cam.y + sy));

  drawFloor();
  drawTerrain();

  // 经验
  for (const g of G.gems) {
    const fl = Math.sin(performance.now() / 300 + g.x) * 0.5 + 0.5;
    ctx.globalAlpha = 0.18 + fl * 0.22;
    ctx.fillStyle = C.gold;
    ctx.beginPath(); ctx.arc(g.x, g.y, 5, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    drawSpr(SPR.gem, g.x, g.y);
  }

  // 火焰区域
  for (const z of G.zones) {
    const k = 1 - z.t / z.life;
    ctx.globalAlpha = 0.35 * k;
    ctx.fillStyle = C.gold;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r * (0.7 + 0.3 * k), 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.5 * k;
    ctx.fillStyle = C.red;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.55, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  for (const e of G.enemies) drawEnemy(e);
  drawBoss();

  // 子弹
  for (const b of G.bullets) {
    if (b.kind === 'pie') {
      ctx.fillStyle = '#c8b48e';
      ctx.fillRect(b.x - 3, b.y - 3, 6, 6);
      ctx.fillStyle = '#8a7a5c';
      ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
    } else if (b.kind === 'nugget') {
      ctx.fillStyle = '#b6a98e';
      ctx.fillRect(b.x - 3, b.y - 2, 6, 4);
      ctx.fillStyle = '#e8e4da';
      ctx.fillRect(b.x - 3, b.y - 2, 6, 1);
    } else {
      ctx.fillStyle = '#e0d6bf';
      ctx.fillRect(b.x - 2, b.y - 1, 4, 2);
      ctx.fillStyle = '#fff';
      ctx.fillRect(b.x - 1, b.y - 1, 1, 1);
    }
  }
  for (const b of G.ebullets) {
    ctx.fillStyle = C.red;
    ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
    ctx.fillStyle = '#ff7a4d';
    ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
  }

  // 玩家
  const p = G.player;
  if (p.inv <= 0 || Math.floor(p.inv * 20) % 2 === 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 4, 4, 2, 0, 0, TAU); ctx.fill();
    drawSpr(SPR.player, p.x, p.y + Math.sin(p.walk) * 0.5, false, p.faceX < 0);
    if (p.shield > 0) {
      ctx.strokeStyle = 'rgba(232,228,218,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, TAU); ctx.stroke();
    }
  }

  // 环刃
  for (const w of G.weapons) {
    if (w.id !== 'ring' || !w.orbs) continue;
    const st = wstatsAt(w.def, w.level);
    for (const o of w.orbs) {
      ctx.fillStyle = st.evo ? C.gold : '#e8e4da';
      ctx.fillRect(o.x - 2, o.y - 6, 4, 12);
      ctx.fillStyle = '#8a8478';
      ctx.fillRect(o.x - 2, o.y + 5, 4, 2);
    }
  }

  // 粒子
  for (const pt of G.parts) {
    ctx.globalAlpha = clamp(pt.life / 0.5, 0, 1);
    ctx.fillStyle = pt.c;
    ctx.fillRect(pt.x, pt.y, pt.s, pt.s);
  }
  ctx.globalAlpha = 1;

  // 环
  for (const r of G.rings) {
    const k = 1 - r.t / r.life;
    ctx.globalAlpha = 0.25 + 0.5 * k;
    ctx.strokeStyle = r.friendly ? (r.dmg > 15 ? C.gold : '#e8e4da') : C.red;
    ctx.lineWidth = r.width * k;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 飘字
  for (const t of G.texts) {
    const a = 1 - t.t / t.life;
    ctx.globalAlpha = a;
    drawText(t.v, t.x, t.y, t.crit ? C.gold : '#f0ece2', t.crit ? 2 : 1);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

function renderMenuBg() {
  const t = performance.now() / 1000;
  ctx.fillStyle = C.floor;
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = C.floor2;
  for (let y = 0; y < VH; y += 24) {
    for (let x = 0; x < VW; x += 24) {
      if (((x / 24) + (y / 24)) % 2 === 0) ctx.fillRect(x, y, 24, 24);
    }
  }
  ctx.fillStyle = 'rgba(255,199,44,0.05)';
  for (let i = 0; i < 12; i++) {
    const x = (i * 73 + t * 12) % (VW + 40) - 20;
    const y = (i * 41 + t * 8) % (VH + 40) - 20;
    ctx.fillRect(x, y, 6, 4);
  }
}

/* ---------- 17. 相机 / UI 刷新 ---------- */
function updateCamera() {
  if (!G) return;
  const p = G.player;
  G.cam.x = clamp(p.x - VW / 2, 0, WW - VW);
  G.cam.y = clamp(p.y - VH / 2, 0, WH - VH);
}

let lastHud = {};
function updateHUD() {
  if (!G) return;
  const p = G.player;
  const hpPct = clamp(p.hp / p.maxHp, 0, 1);
  const w = Math.round(hpPct * 118);
  if (lastHud.hp !== w) { el('hpfill').style.width = w + 'px'; lastHud.hp = w; }
  const low = hpPct < 0.3;
  if (lastHud.low !== low) {
    el('hpfill').classList.toggle('low', low);
    lastHud.low = low;
  }
  const hpT = Math.ceil(p.hp);
  if (lastHud.hpT !== hpT) { el('hptext').textContent = hpT; lastHud.hpT = hpT; }
  const remain = Math.max(0, 300 - G.t);
  const mm = Math.floor(remain / 60), ss = Math.floor(remain % 60);
  const timeStr = (remain < 60 ? '' : mm + ':') + String(ss).padStart(2, '0');
  const tt = remain < 60 ? '0:' + String(ss).padStart(2, '0') : String(mm) + ':' + String(ss).padStart(2, '0');
  if (lastHud.t !== tt) {
    el('timer').textContent = tt;
    lastHud.t = tt;
    el('timer').classList.toggle('urgent', remain < 31);
  }
  if (lastHud.k !== G.kills) { el('kills').textContent = '击杀 ' + G.kills; lastHud.k = G.kills; }
  if (lastHud.lv !== G.level) { el('lvbadge').textContent = 'Lv.' + G.level; lastHud.lv = G.level; }
  const xpPct = clamp(G.xp / G.xpNext, 0, 1);
  el('xpfill').style.width = (xpPct * 100) + '%';
  if (G.boss && G.boss.alive) {
    el('bossfill').style.width = clamp(G.boss.hp / G.boss.maxHp, 0, 1) * 100 + '%';
  }
}

function refreshSlots() {
  const wrap = el('slots');
  wrap.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div');
    d.className = 'slot';
    const c = G.weapons[i];
    if (c) {
      const cv = document.createElement('canvas');
      cv.width = 16; cv.height = 16;
      const g = cv.getContext('2d');
      g.save(); g.scale(16 / 24, 16 / 24);
      drawIcon(g, c.def.icon);
      g.restore();
      d.appendChild(cv);
      const b = document.createElement('b');
      b.textContent = c.level;
      d.appendChild(b);
    }
    wrap.appendChild(d);
  }
}

/* ---------- 18. 结束 ---------- */
function endGame(reason) {
  if (!G || G.state === 'over') return;
  G.state = 'over';
  SFX.bgm.on = false;
  const bossHp = G.boss && G.boss.alive ? G.boss.hp / G.boss.maxHp : 0;
  const killed = !G.boss || !G.boss.alive;
  let grade = 'C';
  if (reason === 'dead') grade = 'C';
  else if (killed) grade = G.level >= 11 ? 'S' : 'A';
  else if (bossHp < 0.5) grade = 'B';
  else grade = 'C';
  el('rtitle').textContent = reason === 'dead' ? '被 消 耗 了' : killed ? '完 美 收 工' : '打 烊 了';
  el('rgrade').textContent = grade;
  el('rgrade').style.color = grade === 'S' ? C.gold : grade === 'A' ? C.white : '#8a8478';
  el('rtime').textContent = Math.floor(G.t / 60) + ':' + String(Math.floor(G.t % 60)).padStart(2, '0');
  el('rkill').textContent = G.kills;
  el('rlv').textContent = 'Lv.' + G.level;
  el('rboss').textContent = G.boss ? Math.round(bossHp * 100) + '%' : '未出现';
  el('result').classList.remove('hide');
}

/* ---------- 19. 主循环 ---------- */
let last = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = clamp((now - last) / 1000 || 0.016, 0, 0.05);
  last = now;
  if (G && G.state === 'playing') {
    if (G.hitstop > 0) G.hitstop -= dt;
    else step(dt);
    updateCamera();
    updateHUD();
    SFX.bgmTick();
  } else if (G && G.state === 'paused') {
    SFX.bgmTick();
  }
  render();
}
requestAnimationFrame(loop);

/* ---------- 20. 启动 ---------- */
function start() {
  SFX.init();
  if (SFX.ac && SFX.ac.state === 'suspended') SFX.ac.resume();
  el('menu').classList.add('hide');
  el('result').classList.add('hide');
  el('pause').classList.add('hide');
  el('bossbar').classList.add('hide');
  el('cards').classList.add('hide');
  lastHud = {};
  newGame();
  updateCamera();
  last = performance.now();
  const tip = el('tip');
  tip.style.opacity = '1';
  clearTimeout(start.tipTimer);
  start.tipTimer = setTimeout(() => { tip.style.opacity = '0'; }, 6000);
}

el('startbtn').onclick = start;
el('againbtn').onclick = start;
el('resumebtn').onclick = togglePause;
el('quitbtn').onclick = () => { el('pause').classList.add('hide'); endGame('dead'); };
document.addEventListener('pointerdown', () => {
  if (SFX.ac && SFX.ac.state === 'suspended') SFX.ac.resume();
});

</script>
</body>
